name: SaltsCore LLVM CI

on:
  pull_request:
    paths:
      - "crypto/**"
      - "cnet/**"
      - "sctp/**"
      - "vendor/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/**"
      - "vcpkg*.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [master]
    tags: ["v0.1.002"]
    paths:
      - "crypto/**"
      - "cnet/**"
      - "sctp/**"
      - "vendor/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/**"
      - "vcpkg*.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: saltscore-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: LLVM / ${{ matrix.rid }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 256MiB
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: linux-x64, runner: ubuntu-24.04, target: x64, triplet: x64-linux, host: x64-linux, preset: llvm-native-release-user, android_abi: "", package: true}
          - {rid: linux-arm64, runner: ubuntu-24.04-arm, target: arm64, triplet: arm64-linux, host: arm64-linux, preset: llvm-native-release-user, android_abi: "", package: true}
          - {rid: macos-x64, runner: macos-15-intel, target: x64, triplet: x64-osx, host: x64-osx, preset: llvm-native-release-user, android_abi: "", package: true}
          - {rid: macos-arm64, runner: macos-15, target: arm64, triplet: arm64-osx, host: arm64-osx, preset: llvm-native-release-user, android_abi: "", package: true}
          - {rid: windows-x64, runner: windows-2025, target: x64, triplet: qigao-x64-windows-llvm-mingw, host: qigao-x64-windows-llvm-mingw, preset: native-release-user, android_abi: "", package: true}
          - {rid: windows-arm64, runner: windows-11-arm, target: arm64, triplet: qigao-arm64-windows-llvm-mingw, host: qigao-arm64-windows-llvm-mingw, preset: native-release-user, android_abi: "", package: true}
          - {rid: linux-x64-asan-ubsan, runner: ubuntu-24.04, target: x64, triplet: x64-linux, host: x64-linux, preset: llvm-native-asan-ubsan-user, android_abi: "", package: false}
          - {rid: linux-x64-tsan, runner: ubuntu-24.04, target: x64, triplet: x64-linux, host: x64-linux, preset: llvm-native-tsan-user, android_abi: "", package: false}
          - {rid: android-x64, runner: ubuntu-24.04, target: x64, triplet: x64-android, host: x64-linux, preset: android-release-user, android_abi: x86_64, package: true}
          - {rid: android-arm64, runner: ubuntu-24.04, target: arm64, triplet: arm64-android, host: x64-linux, preset: android-release-user, android_abi: arm64-v8a, package: true}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out released dependency infrastructure
        uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: v0.1.2
          path: build/ci-infrastructure/vcpkg-cache
          persist-credentials: false

      - uses: actions/setup-python@v5
        id: test-python
        with:
          python-version: '3.12'

      - name: Restore the latest released SaltsBase SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VCPKG_CACHE_READ_TOKEN || github.token }}
          RID: ${{ matrix.rid }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reply = & gh api repos/qigao/salts-base/releases/latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $reply | ConvertFrom-Json
          $stableTag = $release.tag_name -match '^v(\d+\.\d+\.\d+)$'
          if ($release.draft -or $release.prerelease -or -not $stableTag) {
            throw 'A stable SaltsBase semantic-version release is required'
          }
          $version = $Matches[1]
          $manifestName = "salts-base-$version-manifest.json"
          $manifestAsset = @($release.assets | Where-Object name -eq $manifestName)
          if ($manifestAsset.Count -ne 1) { throw "Release $($release.tag_name) must provide one $manifestName" }
          $download = Join-Path $env:RUNNER_TEMP "salts-base-download-$env:RID"
          & gh release download $release.tag_name --repo qigao/salts-base --pattern $manifestName --dir $download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifestFile = Join-Path $download $manifestName
          $manifestHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $manifestFile).Hash.ToLowerInvariant()
          if ("sha256:$manifestHash" -cne $manifestAsset[0].digest) { throw 'SaltsBase release manifest digest mismatch' }
          $manifest = Get-Content -LiteralPath $manifestFile -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or $manifest.name -cne 'SaltsBase' -or
              $manifest.repository -cne 'https://github.com/qigao/salts-base' -or
              $manifest.version -cne $version -or $manifest.tag -cne $release.tag_name -or
              $manifest.ci.conclusion -cne 'success') { throw 'Invalid or unqualified SaltsBase release manifest' }
          $profiles = @{
            'windows-x64'='windows-llvm-mingw-x64'; 'windows-arm64'='windows-llvm-mingw-arm64'
            'linux-x64'='linux-clang-x64'; 'linux-arm64'='linux-clang-arm64'
            'linux-x64-asan-ubsan'='linux-clang-x64'; 'linux-x64-tsan'='linux-clang-x64'
            'macos-x64'='macos-clang-x64'; 'macos-arm64'='macos-clang-arm64'
            'android-x64'='android-x64'; 'android-arm64'='android-arm64'
          }
          $profile = $profiles[$env:RID]
          $sdk = @($manifest.sdks | Where-Object platform -eq $profile)
          if ($sdk.Count -ne 1) { throw "SaltsBase $version has no SDK for $profile; this platform remains unqualified" }
          $sdk = $sdk[0]
          if ($sdk.file -cne "salts-base-$version-$profile.tar") { throw 'Unexpected SaltsBase archive name' }
          & gh release download $release.tag_name --repo qigao/salts-base --pattern $sdk.file --dir $download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $download $sdk.file
          if ((Get-Item -LiteralPath $archive).Length -ne $sdk.sizeBytes -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -cne $sdk.sha256) {
            throw 'SaltsBase SDK archive size or SHA-256 mismatch'
          }
          $sdkRoot = Join-Path $env:RUNNER_TEMP "salts-base-sdk-$env:RID"
          New-Item -ItemType Directory -Path $sdkRoot | Out-Null
          $extract = @'
          import sys, tarfile
          with tarfile.open(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2], filter="data")
          '@
          $extract | python - $archive $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SALTS_BASE_ROOT=$($sdkRoot.Replace('\', '/'))" >> $env:GITHUB_ENV
          "SaltsBase release: $version; source: $($manifest.commit); producer CI: $($manifest.ci.runId); SDK: $profile; SHA-256: $($sdk.sha256)" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore the preinstalled vcpkg-cache SDK
        id: dependencies
        shell: pwsh
        run: |
          & python build/ci-infrastructure/vcpkg-cache/scripts/restore-native-dependency.py `
            locked "cmake/dependencies/${{ matrix.triplet }}.lock.json" `
            --destination "build/dependencies/vcpkg-${{ matrix.rid }}" `
            --payload vcpkg_installed --github-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select restored dependency prefix
        shell: pwsh
        env:
          SDK_ROOT: ${{ steps.dependencies.outputs.root }}
        run: |
          "VCPKG_INSTALLED_DIR=$env:SDK_ROOT" >> $env:GITHUB_ENV

      - name: Restore locked Windows LLVM-MinGW compiler
        id: windows-llvm
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $contract = Get-Content build/ci-infrastructure/vcpkg-cache/compiler-contracts/release-obfuscation.json -Raw | ConvertFrom-Json
          $compiler = $contract.sources.'llvm-mingw'
          $hostId = "windows-$('${{ runner.arch }}'.ToLowerInvariant())"
          $asset = @($compiler.assets | Where-Object host -eq $hostId)
          if ($asset.Count -ne 1) { throw "No locked LLVM-MinGW compiler for $hostId" }
          $asset = $asset[0]
          $target = if ('${{ matrix.target }}' -eq 'arm64') { 'aarch64-w64-mingw32' } else { 'x86_64-w64-mingw32' }
          $url = "https://github.com/$($compiler.repository)/releases/download/$($compiler.release_tag)/$($asset.name)"
          & python build/ci-infrastructure/vcpkg-cache/scripts/restore-native-dependency.py `
            url $url --sha256 $asset.sha256 --destination build/ci-llvm-mingw `
            --payload ([IO.Path]::GetFileNameWithoutExtension($asset.name)) `
            --executable "bin/$target-clang.exe" --executable "bin/$target-clang++.exe" --github-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select Windows compiler SDK
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COMPILER_ROOT: ${{ steps.windows-llvm.outputs.root }}
        run: |
          "LLVM_MINGW_ROOT=$env:COMPILER_ROOT" >> $env:GITHUB_ENV

      - name: Locate Visual Studio developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio C++ tools are required' }
          "VSDEVCMD_BAT=$($installation.Replace('\', '/'))/Common7/Tools/VsDevCmd.bat" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v5
        with:
          go-version-file: cnet/tests/tickets/go.mod
          cache: false

      - name: Install formal TLS test fixture dependency
        if: matrix.android_abi == ''
        # This fixture-only version provides native wheels for all six host
        # OS/architecture pairs, including Windows ARM64 and Intel macOS.
        run: |
          python -m pip install --only-binary=:all: cryptography==46.0.3

      # Local launchers and other CI systems supply these same preset inputs.
      - name: Set platform preset inputs
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET_TRIPLET: ${{ matrix.triplet }}
          ANDROID_ABI: ${{ matrix.android_abi }}
        run: |
          set -euo pipefail
          {
            if [[ "$RID" == android-* ]]; then
              echo "ANDROID_TARGET_TRIPLET=$TARGET_TRIPLET"
              echo "SALTSCORE_ANDROID_ABI=$ANDROID_ABI"
              echo "ANDROID_INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
            elif [[ "$RID" == windows-* ]]; then
              echo "LLVM_MINGW_TARGET=${{ matrix.target == 'arm64' && 'aarch64-w64-mingw32' || 'x86_64-w64-mingw32' }}"
              echo "VCPKG_TARGET_TRIPLET=$TARGET_TRIPLET"
              echo "INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
            else
              echo "LLVM_NATIVE_TARGET_TRIPLET=$TARGET_TRIPLET"
              echo "LLVM_NATIVE_INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
            fi
          } >> "$GITHUB_ENV"

      - name: Install native ccache
        id: ccache
        uses: qigao/vcpkg-cache/.github/actions/setup-ccache@v0.1.2

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies/*.json', 'presets/**/*.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies/*.json', 'presets/**/*.json') }}-

      - name: Start compiler cache statistics
        shell: bash
        run: |
          ccache --version
          ccache --zero-stats

      - name: Configure full graph
        shell: pwsh
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          if ($IsWindows) {
            & cmake/WithVs.cmd cmake --preset "${{ matrix.preset }}"
          } else {
            & cmake --preset "${{ matrix.preset }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build full graph
        id: build
        shell: pwsh
        run: |
          if ($IsWindows) {
            & cmake/WithVs.cmd cmake --build --preset "${{ matrix.preset }}"
          } else {
            & cmake --build --preset "${{ matrix.preset }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report compiler cache statistics
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        shell: bash
        run: ccache --show-stats --verbose

      - name: Run formal CTest suite
        if: matrix.android_abi == ''
        shell: pwsh
        run: |
          if ($IsWindows) {
            & cmake/WithVs.cmd ctest --preset "${{ matrix.preset }}"
          } else {
            & ctest --preset "${{ matrix.preset }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save compiler cache
        if: success() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Install release SDK
        if: matrix.package && github.ref == 'refs/tags/v0.1.002'
        shell: pwsh
        run: |
          if ($IsWindows) {
            & cmake/WithVs.cmd cmake --build --preset "install-${{ matrix.preset }}"
          } else {
            & cmake --build --preset "install-${{ matrix.preset }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record immutable SDK provenance
        if: matrix.package && github.ref == 'refs/tags/v0.1.002'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'package/sdk/${{ matrix.rid }}'
          if (-not (Test-Path "$prefix/lib/cmake/SaltsCore/SaltsCoreConfig.cmake")) {
            throw 'SaltsCore SDK installation is missing'
          }
          @(
            'release=0.1.002'
            'package=0.1.2'
            "commit=$env:GITHUB_SHA"
            'rid=${{ matrix.rid }}'
            'profile=release'
            'compiler=llvm'
            'protection=none'
          ) | Set-Content -Encoding utf8 "$prefix/saltscore-sdk-manifest.txt"

      - uses: actions/upload-artifact@v4
        if: matrix.package && github.ref == 'refs/tags/v0.1.002'
        with:
          name: saltscore-sdk-${{ matrix.rid }}
          path: package
          if-no-files-found: error
          retention-days: 14

  package:
    name: Publish SaltsCore.Native 0.1.2
    if: github.ref == 'refs/tags/v0.1.002'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: saltscore-sdk-*
          path: package
          merge-multiple: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack immutable eight-RID SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 v0.1.002)" = "$GITHUB_SHA"
          test "$(find package/sdk -maxdepth 2 -name saltscore-sdk-manifest.txt | wc -l)" -eq 8
          dotnet pack packaging/nuget/SaltsCore.Native.csproj \
            --configuration Release --output dist \
            -p:PackageVersion=0.1.2 \
            -p:PackageRoot="$GITHUB_WORKSPACE/package"
          package=dist/SaltsCore.Native.0.1.2.nupkg
          test -f "$package"
          sha256sum "$package" > dist/SHA256SUMS
      - name: Refuse an existing release or normalized package version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.002 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'GitHub Release v0.1.002 already exists' >&2
            exit 1
          fi
          inventory="$RUNNER_TEMP/saltscore-packages.json"
          error="$RUNNER_TEMP/saltscore-packages.err"
          if gh api --paginate '/users/qigao/packages/nuget/SaltsCore.Native/versions?per_page=100' > "$inventory" 2> "$error"; then
            python3 - "$inventory" <<'PY'
          import json, sys
          if any(item.get('name', '').lower() == '0.1.2' for item in json.load(open(sys.argv[1]))):
              raise SystemExit('SaltsCore.Native 0.1.2 already exists')
          PY
          elif ! grep -Fq 'HTTP 404' "$error"; then
            cat "$error" >&2
            exit 1
          fi
      - name: Publish NuGet package and GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/saltscore-release-nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet nuget push dist/SaltsCore.Native.0.1.2.nupkg \
            --api-key "$GITHUB_TOKEN" --source github --configfile "$config"
          gh release create v0.1.002 \
            dist/SaltsCore.Native.0.1.2.nupkg dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title 'SaltsCore 0.1.002' --generate-notes --latest

  result:
    name: CI result
    if: ${{ always() }}
    needs: [qualify, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every LLVM qualification job
        shell: bash
        run: |
          test '${{ needs.qualify.result }}' = success
          if [[ '${{ github.ref }}' == refs/tags/v0.1.002 ]]; then
            test '${{ needs.package.result }}' = success
          fi
