name: SaltsCore SDK CI

on:
  pull_request:
    paths:
      - "crypto/**"
      - "cnet/**"
      - "sctp/**"
      - "vendor/**"
      - "CMake*.json"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "cmake/**"
      - "presets/**"
      - ".github/ci/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [master]
    tags: ["v0.1.002"]
    paths:
      - "crypto/**"
      - "cnet/**"
      - "sctp/**"
      - "vendor/**"
      - "CMake*.json"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "cmake/**"
      - "presets/**"
      - ".github/ci/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  VCPKG_CACHE_VERSION: ${{ vars.VCPKG_CACHE_VERSION }}
  SALTS_BASE_VERSION: ${{ vars.SALTS_BASE_VERSION }}

concurrency:
  group: saltscore-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Download shared SDK inputs once
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out released dependency infrastructure
        uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: v${{ env.VCPKG_CACHE_VERSION }}
          path: build/ci-infrastructure/vcpkg-cache
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve one release and the qualification matrix
        id: release
        env:
          GH_TOKEN: ${{ secrets.VCPKG_CACHE_READ_TOKEN || github.token }}
        run: .github/ci/prepare-sdk-inputs.ps1 -Resolve
      - name: Reuse verified native download blobs
        uses: actions/cache@v4
        with:
          path: build/ci-inputs/blobs
          key: sdk-inputs-v2-${{ env.VCPKG_CACHE_VERSION }}-${{ steps.release.outputs.manifest_sha256 }}-${{ hashFiles('.github/ci/sdk-matrix.json', 'cmake/dependencies/*.lock.json', 'build/ci-infrastructure/vcpkg-cache/compiler-contracts/release-obfuscation.json') }}
      - name: Download the locked SDK and compiler inputs
        env:
          GH_TOKEN: ${{ secrets.VCPKG_CACHE_READ_TOKEN || github.token }}
        run: .github/ci/prepare-sdk-inputs.ps1
      - name: Archive the same infrastructure sources for every runner
        run: |
          $archive = [IO.Path]::GetFullPath('build/ci-inputs/infrastructure.tar')
          & git -C build/ci-infrastructure/vcpkg-cache archive --format=tar HEAD --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Distribute prepared inputs
        uses: actions/upload-artifact@v4
        with:
          name: shared-sdk-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-inputs/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: prepare
    name: ${{ matrix.compiler }} / ${{ matrix.rid }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_MAXSIZE: 256MiB
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Receive prepared SDK inputs
        uses: actions/download-artifact@v4
        with:
          name: shared-sdk-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-inputs

      - name: Restore the released infrastructure snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/ci-infrastructure/vcpkg-cache -Force | Out-Null
          $archive = [IO.Path]::GetFullPath('build/ci-inputs/infrastructure.tar')
          Push-Location build/ci-infrastructure/vcpkg-cache
          try {
            & cmake -E tar xf $archive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - uses: actions/setup-python@v5
        id: test-python
        with:
          python-version: '3.12'

      - name: Restore the prepared SaltsBase SDK
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          SDK_PLATFORM: ${{ matrix.sdk }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content build/ci-inputs/salts-base-release.json -Raw | ConvertFrom-Json
          $manifestFile = 'build/ci-inputs/salts-base-manifest.json'
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $manifestFile).Hash.ToLowerInvariant()
          if ("sha256:$digest" -cne $release.manifest.digest) { throw 'Prepared SaltsBase manifest digest mismatch' }
          $manifest = Get-Content $manifestFile -Raw | ConvertFrom-Json
          $profile = $env:SDK_PLATFORM
          $sdk = @($manifest.sdks | Where-Object platform -eq $profile)
          if ($sdk.Count -ne 1) { throw "Prepared SaltsBase release has no SDK for $profile" }
          $sdk = $sdk[0]
          $archive = "build/ci-inputs/blobs/$($sdk.sha256)"
          if ((Get-Item -LiteralPath $archive).Length -ne $sdk.sizeBytes -or
              (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -cne $sdk.sha256) {
            throw 'Prepared SaltsBase SDK archive size or SHA-256 mismatch'
          }
          $sdkRoot = Join-Path $env:RUNNER_TEMP "salts-base-sdk-$env:RID"
          New-Item -ItemType Directory -Path $sdkRoot | Out-Null
          $extract = @'
          import sys, tarfile
          with tarfile.open(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2], filter="data")
          '@
          $extract | python - $archive $sdkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SALTS_BASE_ROOT=$($sdkRoot.Replace('\', '/'))" >> $env:GITHUB_ENV
          "SaltsBase $($manifest.version); source $($manifest.commit); SDK $profile; SHA-256 $($sdk.sha256)" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore the preinstalled vcpkg-cache SDK
        id: dependencies
        shell: pwsh
        env:
          QIGAO_PREPARED_INPUTS: ${{ github.workspace }}/build/ci-inputs
        run: |
          & python build/ci-infrastructure/vcpkg-cache/scripts/restore-native-dependency.py `
            locked "build/ci-inputs/locks/${{ matrix.triplet }}.lock.json" `
            --destination "build/dependencies/vcpkg-${{ matrix.rid }}" `
            --payload vcpkg_installed --github-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select restored dependency prefix
        shell: pwsh
        env:
          SDK_ROOT: ${{ steps.dependencies.outputs.root }}
        run: |
          "VCPKG_INSTALLED_DIR=$env:SDK_ROOT" >> $env:GITHUB_ENV

      - name: Restore prepared Windows LLVM-MinGW compiler
        id: windows-llvm
        if: matrix.compiler == 'llvm-mingw'
        shell: pwsh
        env:
          QIGAO_PREPARED_INPUTS: ${{ github.workspace }}/build/ci-inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $lockFile = 'build/ci-inputs/locks/windows-compiler.lock.json'
          $lock = Get-Content $lockFile -Raw | ConvertFrom-Json
          $payload = [IO.Path]::GetFileNameWithoutExtension(([Uri]$lock.source.url).AbsolutePath)
          & python build/ci-infrastructure/vcpkg-cache/scripts/restore-native-dependency.py `
            locked $lockFile --destination build/ci-llvm-mingw --payload $payload `
            --executable bin/x86_64-w64-mingw32-clang.exe `
            --executable bin/x86_64-w64-mingw32-clang++.exe --github-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select Windows compiler SDK
        if: matrix.compiler == 'llvm-mingw'
        shell: pwsh
        env:
          COMPILER_ROOT: ${{ steps.windows-llvm.outputs.root }}
        run: |
          "LLVM_MINGW_ROOT=$env:COMPILER_ROOT" >> $env:GITHUB_ENV

      - name: Locate Visual Studio developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual Studio C++ tools are required' }
          "VSDEVCMD_BAT=$($installation.Replace('\', '/'))/Common7/Tools/VsDevCmd.bat" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v5
        with:
          go-version-file: cnet/tests/tickets/go.mod
          cache: false

      - name: Install formal TLS test fixture dependency
        if: matrix.android_abi == ''
        # Fixture-only dependency; native SDK architecture comes from the matrix.
        run: |
          python -m pip install --only-binary=:all: cryptography==46.0.3

      # Local launchers and other CI systems supply these same preset inputs.
      - name: Set platform preset inputs
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET_TRIPLET: ${{ matrix.triplet }}
          COMPILER: ${{ matrix.compiler }}
          ANDROID_ABI: ${{ matrix.android_abi }}
        run: |
          set -euo pipefail
          {
            if [[ "$RID" == android-* ]]; then
              echo "ANDROID_TARGET_TRIPLET=$TARGET_TRIPLET"
              echo "SALTSCORE_ANDROID_ABI=$ANDROID_ABI"
              echo "ANDROID_INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
            elif [[ "$COMPILER" == msvc ]]; then
              echo "MSVC_TARGET_TRIPLET=$TARGET_TRIPLET"
              echo "MSVC_INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
            elif [[ "$COMPILER" == gcc ]]; then
              echo "GCC_C_COMPILER=gcc"
              echo "GCC_CXX_COMPILER=g++"
              echo "GCC_TARGET_TRIPLET=$TARGET_TRIPLET"
              echo "GCC_INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
            elif [[ "$COMPILER" == llvm-mingw ]]; then
              echo "LLVM_MINGW_TARGET=${{ matrix.target == 'arm64' && 'aarch64-w64-mingw32' || 'x86_64-w64-mingw32' }}"
              echo "VCPKG_TARGET_TRIPLET=$TARGET_TRIPLET"
              echo "INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
            else
              echo "LLVM_NATIVE_TARGET_TRIPLET=$TARGET_TRIPLET"
              echo "LLVM_NATIVE_INSTALL_PREFIX=$GITHUB_WORKSPACE/package/sdk/$RID"
            fi
          } >> "$GITHUB_ENV"

      - name: Install native ccache
        id: ccache
        uses: ./build/ci-infrastructure/vcpkg-cache/.github/actions/setup-ccache

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies/*.json', 'presets/**/*.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rid }}-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies/*.json', 'presets/**/*.json') }}-

      - name: Start compiler cache statistics
        shell: bash
        run: |
          ccache --version
          ccache --zero-stats

      - name: Configure full graph
        shell: pwsh
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          if ($IsWindows) {
            & cmake/WithVs.cmd cmake --preset "${{ matrix.preset }}"
          } else {
            & cmake --preset "${{ matrix.preset }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build full graph
        id: build
        shell: pwsh
        run: |
          if ($IsWindows) {
            & cmake/WithVs.cmd cmake --build --preset "${{ matrix.preset }}"
          } else {
            & cmake --build --preset "${{ matrix.preset }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report compiler cache statistics
        if: always() && steps.build.outcome != 'skipped' && steps.build.outcome != ''
        shell: bash
        run: ccache --show-stats --verbose

      - name: Run formal CTest suite
        if: matrix.android_abi == ''
        shell: pwsh
        run: |
          if ($IsWindows) {
            & cmake/WithVs.cmd ctest --preset "${{ matrix.preset }}"
          } else {
            & ctest --preset "${{ matrix.preset }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save compiler cache
        if: success() && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Install release SDK
        if: matrix.package && (github.ref == 'refs/tags/v0.1.002' || matrix.android_abi != '')
        shell: pwsh
        run: |
          if ($IsWindows) {
            & cmake/WithVs.cmd cmake --build --preset "install-${{ matrix.preset }}"
          } else {
            & cmake --build --preset "install-${{ matrix.preset }}"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed Android ELF load alignment
        if: matrix.android_abi != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $readelf = Join-Path $env:ANDROID_NDK_HOME 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf'
          $library = 'package/sdk/${{ matrix.rid }}/lib/libcnet.so'
          $headers = & $readelf --program-headers --wide $library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $loads = $headers | Select-String '^\s*LOAD\s+.+\s0x([0-9a-fA-F]+)\s*$'
          if (!$loads) { throw "No ELF LOAD segments in $library" }
          foreach ($load in $loads) {
            $alignment = [Convert]::ToInt32($load.Matches[0].Groups[1].Value, 16)
            if ($alignment -lt 16384) { throw "$library has a LOAD segment aligned to $alignment bytes" }
          }
          Write-Host 'Installed libcnet.so uses at least 16 KiB alignment for each LOAD segment'

      - name: Record immutable SDK provenance
        if: matrix.package && github.ref == 'refs/tags/v0.1.002'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'package/sdk/${{ matrix.rid }}'
          if (-not (Test-Path "$prefix/lib/cmake/SaltsCore/SaltsCoreConfig.cmake")) {
            throw 'SaltsCore SDK installation is missing'
          }
          @(
            'release=0.1.002'
            'package=0.1.2'
            "commit=$env:GITHUB_SHA"
            'rid=${{ matrix.rid }}'
            'profile=release'
            'compiler=llvm'
            'protection=none'
          ) | Set-Content -Encoding utf8 "$prefix/saltscore-sdk-manifest.txt"

      - uses: actions/upload-artifact@v4
        if: matrix.package && github.ref == 'refs/tags/v0.1.002'
        with:
          name: saltscore-sdk-${{ matrix.rid }}
          path: package
          if-no-files-found: error
          retention-days: 14

  package:
    name: Publish SaltsCore.Native 0.1.2
    if: github.ref == 'refs/tags/v0.1.002'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: saltscore-sdk-*
          path: package
          merge-multiple: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pack immutable eight-RID SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 v0.1.002)" = "$GITHUB_SHA"
          test "$(find package/sdk -maxdepth 2 -name saltscore-sdk-manifest.txt | wc -l)" -eq 8
          dotnet pack packaging/nuget/SaltsCore.Native.csproj \
            --configuration Release --output dist \
            -p:PackageVersion=0.1.2 \
            -p:PackageRoot="$GITHUB_WORKSPACE/package"
          package=dist/SaltsCore.Native.0.1.2.nupkg
          test -f "$package"
          sha256sum "$package" > dist/SHA256SUMS
      - name: Refuse an existing release or normalized package version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.002 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'GitHub Release v0.1.002 already exists' >&2
            exit 1
          fi
          inventory="$RUNNER_TEMP/saltscore-packages.json"
          error="$RUNNER_TEMP/saltscore-packages.err"
          if gh api --paginate '/users/qigao/packages/nuget/SaltsCore.Native/versions?per_page=100' > "$inventory" 2> "$error"; then
            python3 - "$inventory" <<'PY'
          import json, sys
          if any(item.get('name', '').lower() == '0.1.2' for item in json.load(open(sys.argv[1]))):
              raise SystemExit('SaltsCore.Native 0.1.2 already exists')
          PY
          elif ! grep -Fq 'HTTP 404' "$error"; then
            cat "$error" >&2
            exit 1
          fi
      - name: Publish NuGet package and GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/saltscore-release-nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet nuget push dist/SaltsCore.Native.0.1.2.nupkg \
            --api-key "$GITHUB_TOKEN" --source github --configfile "$config"
          gh release create v0.1.002 \
            dist/SaltsCore.Native.0.1.2.nupkg dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title 'SaltsCore 0.1.002' --generate-notes --latest

  result:
    name: CI result
    if: ${{ always() }}
    needs: [prepare, qualify, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every SDK qualification job
        shell: bash
        run: |
          test '${{ needs.prepare.result }}' = success
          test '${{ needs.qualify.result }}' = success
          if [[ '${{ github.ref }}' == refs/tags/v0.1.002 ]]; then
            test '${{ needs.package.result }}' = success
          fi
